name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Pint (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer
      - name: Get composer cache directory
        id: composer-cache-dir
        run: echo "cache-dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ steps.composer-cache-dir.outputs.cache-dir }}
          key: ${{ runner.os }}-composer-highest-${{ hashFiles('composer.json') }}
          restore-keys: ${{ runner.os }}-composer-highest-
      - run: composer install --no-interaction --prefer-dist
      - run: vendor/bin/pint --test

  analyse:
    name: PHPStan (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer
      - name: Get composer cache directory
        id: composer-cache-dir
        run: echo "cache-dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ steps.composer-cache-dir.outputs.cache-dir }}
          key: ${{ runner.os }}-composer-highest-${{ hashFiles('composer.json') }}
          restore-keys: ${{ runner.os }}-composer-highest-
      - run: composer install --no-interaction --prefer-dist
      - run: vendor/bin/phpstan analyse --memory-limit=1G

  test:
    name: PHPUnit (PHP ${{ matrix.php-version }}, ${{ matrix.dependencies }} dependencies)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.3', '8.4', '8.5']
        dependencies: ['highest']
        include:
          - php-version: '8.3'
            dependencies: 'lowest'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer
          coverage: none
      - name: Get composer cache directory
        id: composer-cache-dir
        run: echo "cache-dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ steps.composer-cache-dir.outputs.cache-dir }}
          key: ${{ runner.os }}-composer-${{ matrix.dependencies }}-${{ hashFiles('composer.json') }}
          restore-keys: ${{ runner.os }}-composer-${{ matrix.dependencies }}-
      - if: matrix.dependencies == 'highest'
        run: composer install --no-interaction --prefer-dist
      - if: matrix.dependencies == 'lowest'
        run: composer update --prefer-lowest --prefer-stable --no-interaction --prefer-dist
      - run: vendor/bin/phpunit

  zizmor:
    # zizmor: ignore[stale-action-refs] solmyrhq/actions has no release tags. The pin is a commit on its main branch.
    uses: solmyrhq/actions/.github/workflows/zizmor.yml@cd7f53c8698f8f22c74d17d82c3f30558e2d9d6e
    permissions:
      contents: read

  # The only check that the default branch's ruleset requires, by this name,
  # so every other job must be in `needs`. The ruleset is in
  # solmyrhq/gingerbread, infra/terraform/github-rulesets.tf.
  ci-result:
    name: CI result
    needs: [lint, analyse, test, zizmor]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail when a job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
